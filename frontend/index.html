<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome | Recruitment Manager</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --text: #e5e7eb;
        --muted: #9ca3af;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #020817, #0f172a 30%, #111827);
        color: var(--text);
      }

      .card {
        width: min(480px, 90vw);
        background: rgba(17, 24, 39, 0.96);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 18px;
        padding: 32px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.45);
      }

      h1 { margin: 0 0 8px; font-size: 2rem; }
      p { color: var(--muted); margin: 0 0 20px; }
      .name-input {
        width: 100%;
        background: #0b1220;
        color: var(--text);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 8px;
        font-size: 1rem;
        padding: 14px 18px;
        margin-bottom: 12px;
      }

      .name-input:focus { outline: 2px solid #60a5fa; outline-offset: 2px; }
      .continue-btn {
        width: 100%;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        padding: 14px 18px;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .continue-btn:hover { background: var(--primary-dark); }
      .name-form { margin-top: 24px; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Recruitment Manager</h1>
      <p>Let’s find the people who move great teams forward.</p>
      <form id="name-form" class="name-form">
        <label for="user-name">What should we call you?</label>
        <input id="user-name" class="name-input" name="name" type="text" autocomplete="name" maxlength="60" required />
        <button class="continue-btn" type="submit">Continue</button>
      </form>
    </main>

    <script>
      const nameInput = document.getElementById('user-name');
      nameInput.value = localStorage.getItem('recruitment_manager_name') || '';

      document.getElementById('name-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const name = nameInput.value.trim();
        if (!name) {
          nameInput.focus();
          return;
        }

        localStorage.setItem('recruitment_manager_name', name);
        window.location.href = 'dashboard.html';
      });
    </script>
  </body>
</html>
