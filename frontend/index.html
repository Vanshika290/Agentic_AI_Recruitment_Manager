<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome | Agentic AI Recruitment Manager</title>
    <style>
      :root {
        --ink: #172b4d;
        --muted: #62748a;
        --blue: #1769d2;
        --blue-dark: #1054ac;
        --line: #d9e4f2;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Segoe UI", sans-serif;
        background: #edf4fc;
        color: var(--ink);
      }

      .card {
        width: min(480px, 100%);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 40px;
        box-shadow: 0 16px 40px rgba(29, 73, 125, 0.1);
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        margin-bottom: 28px;
        border-radius: 8px;
        background: #e7f1ff;
        color: var(--blue);
        font-size: 0.9rem;
        font-weight: 750;
      }
      h1 { margin: 0 0 10px; font-family: Georgia, serif; font-size: 2rem; }
      p { color: var(--muted); margin: 0 0 26px; line-height: 1.6; }
      label { display: block; margin-bottom: 8px; font-size: 0.9rem; font-weight: 650; }
      .name-input {
        width: 100%;
        background: #fff;
        color: var(--ink);
        border: 1px solid #b9cbe0;
        border-radius: 8px;
        font-size: 1rem;
        padding: 13px 14px;
        margin-bottom: 16px;
      }

      .name-input:focus { outline: 3px solid #c8e0ff; border-color: var(--blue); }
      fieldset { margin: 20px 0 16px; padding: 0; border: 0; }
      legend { margin-bottom: 9px; font-size: 0.9rem; font-weight: 650; }
      .role-option {
        display: flex;
        gap: 11px;
        align-items: flex-start;
        padding: 12px 13px;
        margin-top: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
      }
      .role-option:has(input:checked) { border-color: var(--blue); background: #f2f7ff; }
      .role-option input { margin: 3px 0 0; accent-color: var(--blue); }
      .role-copy { display: grid; gap: 3px; }
      .role-copy strong { font-size: 0.93rem; }
      .role-copy small { color: var(--muted); font-size: 0.82rem; line-height: 1.4; }
      .continue-btn {
        width: 100%;
        background: var(--blue);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        padding: 13px 18px;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.15s ease;
      }

      .continue-btn:hover { background: var(--blue-dark); transform: translateY(-1px); }
      @media (max-width: 480px) { .card { padding: 28px 22px; } }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand-mark" aria-hidden="true">RM</div>
      <h1>Recruitment Manager</h1>
      <p>Let’s find the people who move great teams forward.</p>
      <form id="name-form">
        <label for="user-name">What should we call you?</label>
        <input id="user-name" class="name-input" name="name" type="text" autocomplete="name" maxlength="60" required />
        <fieldset>
          <legend>Which best describes you?</legend>
          <label class="role-option">
            <input type="radio" name="profession" value="hr" required />
            <span class="role-copy"><strong>I'm part of an HR team</strong><small>Find and compare candidates for a job description.</small></span>
          </label>
          <label class="role-option">
            <input type="radio" name="profession" value="student" required />
            <span class="role-copy"><strong>I'm a student or job seeker</strong><small>Check your resume and get guidance for your target role.</small></span>
          </label>
        </fieldset>
        <button class="continue-btn" type="submit">Continue</button>
      </form>
    </main>

    <script>
      const nameInput = document.getElementById('user-name');
      nameInput.value = localStorage.getItem('recruitment_manager_name') || '';
      const savedProfession = localStorage.getItem('recruitment_manager_profession');
      if (savedProfession) {
        const savedOption = document.querySelector(`input[name="profession"][value="${savedProfession}"]`);
        if (savedOption) savedOption.checked = true;
      }

      document.getElementById('name-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const name = nameInput.value.trim();
        if (!name) {
          nameInput.focus();
          return;
        }

        const profession = new FormData(event.currentTarget).get('profession');
        if (!profession) return;
        localStorage.setItem('recruitment_manager_name', name);
        localStorage.setItem('recruitment_manager_profession', profession);
        window.location.href = profession === 'student' ? 'student.html' : 'dashboard.html';
      });
    </script>
  </body>
</html>
